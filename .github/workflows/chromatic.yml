name: Chromatic

# Publishes the Storybook to Chromatic on every push and pull request so
# visual regressions are caught before merge. The first build was seeded
# locally; subsequent builds run here with CHROMATIC_PROJECT_TOKEN from
# repo secrets.
#
# Snapshot quota lives under a budget (free tier 5000 / OSS tier 7500 per
# month). Changes that cannot affect the visual output (docs, changelogs,
# changesets, dependabot config, the auto-merge workflow) spend no snapshots:
# the `scope` step below detects them and the Chromatic step runs with
# `skip`, which marks the commit as passing with zero snapshots.
#
# The workflow itself always runs. It used to be filtered with `paths-ignore`,
# but `UI Tests`, `UI Review` and `Publish Storybook` are required checks on
# `main`: a workflow that never starts reports nothing, so a docs-only pull
# request stayed BLOCKED forever and could only land with an admin bypass
# (Chromatic's docs: "Skip the build with --skip instead of skipping the CI
# step"). Now every pull request gets the three checks, true for what it is.
#
# Dependabot PRs continue to run Chromatic on purpose: a future PR is
# expected to re-enable TurboSnap with a content-hash fingerprint of
# `pharos-tokens`, after which a Dependabot bump that does not change the
# fingerprint will skip every snapshot anyway, and the rare bump that
# does change it (typically a pharos-tokens release) still wants a
# visual check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Publish Storybook
    runs-on: ubuntu-latest
    # Skip the whole job on the `main` push of a Changesets version commit.
    # "chore: version packages" only bumps `package.json` + CHANGELOG, which
    # never changes a story — yet `package.json` busts TurboSnap into a full
    # 96-story rebuild. Post-merge there is no required check to satisfy, so a
    # job skip is safe here. The PR side is handled by the `skip` input below
    # (which keeps the UI Review / UI Tests checks green with 0 snapshots).
    # Does NOT affect Dependabot — a dependency bump can change the render, so
    # those keep running. See Runbooks §21.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore: version packages')
    steps:
      - uses: actions/checkout@v6
        with:
          # Chromatic needs full git history to detect baselines and changes.
          fetch-depth: 0

      # Can this change alter what a story renders? Only if it touches a file
      # outside the list below — the list `paths-ignore` used to carry.
      - name: Decide whether the change is visual
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "visual=true" >> "$GITHUB_OUTPUT"; echo "No base to compare with: treating as visual."; exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          visual=$(printf '%s\n' "$changed" | grep -v -E '(\.mdx?$|^\.changeset/|^CHANGELOG\.md$|^LICENSE$|^\.github/dependabot\.yml$|^\.github/workflows/dependabot-auto-merge\.yml$)' | grep -c . || true)
          echo "Changed files:"; printf '  %s\n' $changed
          if [ "$visual" -gt 0 ]; then echo "visual=true" >> "$GITHUB_OUTPUT"; else echo "visual=false" >> "$GITHUB_OUTPUT"; fi
          echo "Files that can change a story: $visual"

      - name: Install pnpm
        if: steps.scope.outputs.visual == 'true'
        # Without `version`, it installs the pnpm in `packageManager`.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.scope.outputs.visual == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.scope.outputs.visual == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish to Chromatic
        uses: chromaui/action@v17
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Skip waiting for the visual review to finish — GitHub Checks get
          # the final status via Chromatic's own integration.
          exitOnceUploaded: true
          # Report the Chromatic checks green with ZERO snapshots when the
          # change cannot alter a story (the `scope` step), and on the
          # Changesets version PR (branch `changeset-release/main`): a version
          # bump changes only `package.json` + CHANGELOG (no visual impact),
          # but `package.json` would otherwise force a full TurboSnap rebuild.
          # Using the action's `skip` — not a job-level `if` or a path filter —
          # keeps the required UI Review / UI Tests checks reported (green) so
          # the PR can still merge. See Runbooks §21.
          skip: ${{ steps.scope.outputs.visual != 'true' || startsWith(github.head_ref, 'changeset-release/') }}
          # When a build runs on `main`, accept any visual change the PR
          # has already approved. Prevents baseline drift: without this,
          # a baseline stays frozen at the last manually-accepted build
          # forever. If between accepted-build N and the next manually
          # accepted build N+M someone merges a PR with visual changes,
          # all subsequent PRs compare against build N — so the diff
          # piles up instead of resetting per merge. Setting
          # `autoAcceptChanges: main` says "what landed on main is the
          # new truth", which is correct as long as PRs themselves
          # cannot merge with un-reviewed Chromatic changes (enforced
          # via branch protection on this repo).
          autoAcceptChanges: main
          # TurboSnap: rebuild only the stories whose transitive dependency
          # graph in the *git tree* has changed. The historical hazard
          # (silent stale snapshots when `@code-sherpas/pharos-tokens`
          # released a new CSS without any pharos-react source file being
          # touched) is now covered by the `externals` glob below: the
          # `postinstall` script writes `.pharos-tokens.fingerprint` from
          # the resolved package contents; a pharos-tokens release that
          # changes any byte of its publish directory mutates the hash;
          # CI's `verify-fingerprint` step (ci.yml) blocks any PR whose
          # committed fingerprint disagrees with `node_modules/`. With
          # those guard rails TurboSnap can be trusted to invalidate the
          # whole baseline whenever the fingerprint moves, so stale-token
          # snapshots cannot ship.
          onlyChanged: true
          externals: |
            .pharos-tokens.fingerprint
